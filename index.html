<!doctype html>
<html lang="en">
<head>

<title>Family Tree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='24' r='20' fill='%232f5d50'/%3E%3Crect x='28' y='36' width='8' height='22' rx='2' fill='%236b4f2a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/style.css">

<body>
<header class="topbar">
  <a class="brand" href="#/">
    <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="20" fill="currentColor"/><rect x="28" y="36" width="8" height="22" rx="2" fill="#8a6a3c"/></svg>
    <span id="brand-title">Family Tree</span>

  <nav class="mainnav">

  </form>
